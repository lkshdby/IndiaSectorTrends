<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Solid Square Sage Green #A2AB73 Background (Full-Bleed No Rounded Corners for iOS Apple Touch Icon Spec) -->
  <rect width="512" height="512" fill="#A2AB73"/>

  <!-- Chart Graphic Container with Optical Centering & Margin -->
  <g transform="translate(68, 68) scale(0.734)">
    <!-- Axes (Thick Charcoal/Black #231F20) -->
    <!-- X-Axis Line and Arrowhead -->
    <path d="M 0 456 L 476 456" stroke="#231F20" stroke-width="26" stroke-linecap="square" />
    <path d="M 450 426 L 502 456 L 450 486" fill="none" stroke="#231F20" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Y-Axis Line and Arrowhead -->
    <path d="M 44 502 L 44 26" stroke="#231F20" stroke-width="26" stroke-linecap="square" />
    <path d="M 14 52 L 44 0 L 74 52" fill="none" stroke="#231F20" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" />

    <!-- 1. Top Trendline (Deep Red/Brown #A8240D) -->
    <path d="M 50 176 L 120 110 L 235 240 L 300 160 L 345 220 L 460 108"
          fill="none"
          stroke="#A8240D"
          stroke-width="24"
          stroke-linecap="round"
          stroke-linejoin="round" />

    <!-- 2. Middle Trendline (Vibrant Amber Gold #F5B800) -->
    <path d="M 50 324 L 84 286 L 176 390 L 320 264 L 366 324 L 466 220"
          fill="none"
          stroke="#F5B800"
          stroke-width="24"
          stroke-linecap="round"
          stroke-linejoin="round" />

    <!-- 3. Bottom Trendline (Vibrant Electric Blue #1971C2) -->
    <path d="M 50 442 L 176 244 L 285 418 L 345 356 L 456 356"
          fill="none"
          stroke="#1971C2"
          stroke-width="24"
          stroke-linecap="round"
          stroke-linejoin="round" />
  </g>
</svg>
