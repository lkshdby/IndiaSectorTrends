<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1f1a"/>
      <stop offset="100%" stop-color="#0f110e"/>
    </linearGradient>
    <linearGradient id="sageGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8c975a"/>
      <stop offset="50%" stop-color="#A2AB73"/>
      <stop offset="100%" stop-color="#c5cea1"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A2AB73" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#A2AB73" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Background -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)"/>
  
  <!-- Subtle inner border -->
  <rect x="8" y="8" width="496" height="496" rx="107" fill="none" stroke="#A2AB73" stroke-width="4" stroke-opacity="0.25"/>

  <!-- Background Trend Wave Glow -->
  <path d="M 64 390 C 140 370, 200 390, 280 290 C 350 200, 390 140, 448 90" fill="none" stroke="url(#glowGrad)" stroke-width="42" stroke-linecap="round"/>

  <!-- Geometric Bull & Ascending Trendline -->
  <!-- Left Horn -->
  <path d="M 140 230 L 100 135 L 185 180 Z" fill="url(#sageGrad)"/>
  
  <!-- Right Horn transitioning into Ascending Ray -->
  <path d="M 270 190 L 330 135 L 295 210 Z" fill="url(#sageGrad)"/>

  <!-- Geometric Bull Head Silhouette Face -->
  <polygon points="150,195 285,195 320,270 260,370 175,370 115,270" fill="#181b16" stroke="url(#sageGrad)" stroke-width="12" stroke-linejoin="round"/>
  
  <!-- Bull Brow & Nose Bridge Accents -->
  <polygon points="217,215 255,275 180,275" fill="url(#sageGrad)"/>
  <polygon points="217,300 245,355 190,355" fill="url(#sageGrad)"/>

  <!-- High-Power Ascending Momentum Trend Ray -->
  <path d="M 90 410 C 170 410, 220 360, 300 250 C 360 170, 400 110, 448 74" fill="none" stroke="url(#sageGrad)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  
  <!-- Momentum Peak Node / Arrowhead -->
  <circle cx="448" cy="74" r="22" fill="#c5cea1" filter="url(#glow)"/>
  <circle cx="448" cy="74" r="12" fill="#1c1f1a"/>
</svg>
