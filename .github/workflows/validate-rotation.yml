name: Validate Sector Rotation
on:
  push:
    branches:
      - fix/rotation-data-integrity-20261109
      - feat/sector-universe-price-qa-20261109
      - fix/vercel-market-sync-405-20261109
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Type check
        run: npm run lint
      - name: Index math tests
        run: npx tsx --test src/utils/sectorIndexMath.test.ts
      - name: Price quality tests
        run: npx tsx --test src/utils/priceQuality.test.ts
      - name: Sector membership tests
        run: npx tsx --test src/data/sectorUniverse.test.ts
      - name: Production build
        run: npm run build
