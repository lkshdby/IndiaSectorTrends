name: Validate Sector Rotation
on:
  push:
    branches:
      - fix/rotation-data-integrity-20261109
      - feat/sector-universe-price-qa-20261109
      - fix/vercel-market-sync-405-20261109
      - fix/three-slot-scheduled-snapshot-no-secrets
      - feat/ux-phase1-personal-tracking-20261110
      - feat/basic-industry-discovery-phase2-20261110
      - feat/basic-industry-mapping-audit-import-20261110
      - feat/nse-source-annotated-industry-coverage-20261110
      - feat/manual-market-refresh-commits-20261110
      - fix/dashboard-reload-direct-github-snapshot-20261110
      - fix/actions-snapshot-git-rebase-128-20261110
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Type check
        run: npm run lint
      - name: Index math tests
        run: npx tsx --test src/utils/sectorIndexMath.test.ts
      - name: Price quality and Yahoo trading-session freshness tests
        run: npx tsx --test src/utils/priceQuality.test.ts src/utils/marketSessionFreshness.test.ts
      - name: Sector membership tests
        run: npx tsx --test src/data/sectorUniverse.test.ts
      - name: Three-slot scheduling and credential-free reload tests
        run: npx tsx --test scripts/market-schedule.test.ts
      - name: Live-snapshot client fallback tests
        run: npx tsx --test src/utils/marketSnapshotClient.test.ts
      - name: Personal tracking and chart-first usability tests
        run: npx tsx --test src/utils/trackedStocks.test.ts
      - name: Basic industry taxonomy and discovery index tests
        run: npx tsx --test src/utils/basicIndustryAnalytics.test.ts
      - name: Industry mapping coverage and licensed CSV staging validation
        run: |
          npx tsx --test src/utils/basicIndustryCoverage.test.ts
          npx tsx scripts/review-basic-industry-import.ts --coverage
      - name: Direct NSE quote evidence and conservative hypothesis tests
        run: npx tsx --test src/utils/industryEvidence.test.ts
      - name: Full-universe Screener trusted-source reconciliation tests
        run: npx tsx --test src/utils/screenerIndustryReview.test.ts
      - name: Private Screener industry import and heatmap isolation tests
        run: npx tsx --test src/utils/privateIndustryEvidence.test.ts
      - name: Basic-industry heatmap momentum and sorting tests
        run: npx tsx --test src/utils/industryHeatmap.test.ts
      - name: Research rotation radar and forward validation tests
        run: npx tsx --test src/utils/rotationRadar.test.ts
      - name: Radar to same-theme chart navigation tests
        run: npx tsx --test src/utils/themeChartNavigation.test.ts
      - name: Owner thematic composition audit tests
        run: npx tsx --test src/utils/themeCompositionReviews.test.ts
      - name: Point-in-time rotation diary and forward outcome tests
        run: npx tsx --test scripts/record-rotation-signals.test.ts
      - name: Full thematic-membership and stock-leadership validation
        run: npx tsx --test src/utils/stockDiscovery.test.ts
      - name: Shared industry-to-theme candidate and ecosystem isolation tests
        run: npx tsx --test src/utils/sharedUniverseIntegration.test.ts
      - name: Safe owner-approved price-monitoring and private candidate import tests
        run: npx tsx --test src/utils/priceMonitoring.test.ts
      - name: Approved NSE monitoring leader analysis tests
        run: npx tsx --test src/utils/monitoringLeadership.test.ts
      - name: Production build
        run: npm run build

  annotate:
    if: github.event_name == 'push' && github.ref_name == 'feat/nse-source-annotated-industry-coverage-20261110'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check public NSE quote classification availability (maximum 40 lookups)
        run: npx tsx scripts/annotate-nse-industries.ts --max 40
      - name: Validate the newly collected classifications
        run: |
          npm run lint
          npx tsx --test src/utils/industryEvidence.test.ts src/utils/basicIndustryAnalytics.test.ts
      - name: Commit exact public NSE observations
        run: |
          if git diff --quiet -- src/data/nseIndustryQuoteEvidence.json; then
            echo "No accepted direct quote data; preserving existing reviewed mappings"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/nseIndustryQuoteEvidence.json
          git commit -m "data: record directly observed NSE basic-industry classifications"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
