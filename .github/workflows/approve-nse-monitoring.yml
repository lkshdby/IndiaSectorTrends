name: Approve owner-requested NSE daily price monitoring

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: owner-price-monitoring
  cancel-in-progress: false

jobs:
  monitor-approval:
    # Only owner-authored requests; issue body is read as data, never as shell code.
    if: >
      github.actor == 'lkshdby' &&
      github.event.issue.user.login == 'lkshdby' &&
      github.event.issue.author_association == 'OWNER' &&
      startsWith(github.event.issue.title, '[Monitor NSE] Approve ')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund --no-save --package-lock=false
      - name: Accept exact validated ticker-only request
        id: accept
        run: npx tsx scripts/approve-monitoring-issue.ts
      - name: Commit approved monitoring list
        if: steps.accept.outputs.added != '0'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/data/priceMonitoringSymbols.json
          git diff --cached --quiet && exit 1
          git commit -m "data: add owner-approved NSE monitoring symbols [skip ci]"
          git restore -- package-lock.json
          if ! git diff --quiet; then
            echo "::error::Unexpected tracked changes in owner approval workflow"
            exit 1
          fi
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
      - name: Trigger market refresh for newly approved symbols
        if: steps.accept.outputs.added != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run market-snapshot-refresh.yml --ref main
      - name: Tell owner what happens next
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
          ADDED: ${{ steps.accept.outputs.added }}
          SKIPPED: ${{ steps.accept.outputs.skipped }}
          TOTAL: ${{ steps.accept.outputs.total }}
        run: |
          gh issue comment "$ISSUE" --body "Monitoring approval accepted: **$ADDED** new NSE ticker(s); **$SKIPPED** were already tracked; **$TOTAL** additional ticker(s) now in the public price-monitoring list. If any were new, a market refresh was requested. Daily closes appear only after a successful provider fetch and quality validation. **No private Screener rows were uploaded; this does not change theme membership.**"
