name: Collect NSE basic-industry evidence (manual or one-time smoke test)

on:
  push:
    branches:
      - feat/nse-source-annotated-industry-coverage-20261110
    paths:
      - .github/workflows/collect-basic-industry-evidence.yml
  workflow_dispatch:
    inputs:
      max_symbols:
        description: "Max new symbols to look up (0 = all remaining, with polite rate limit)"
        required: true
        default: '0'
      target_branch:
        description: "Branch to write evidence JSON to (not automatically promoted into the official mapping)"
        required: true
        default: 'feat/nse-source-annotated-industry-coverage-20261110'

permissions:
  contents: write

concurrency:
  group: nse-industry-evidence
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - name: Checkout target research branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.target_branch || github.ref_name }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify NSE quote evidence and annotate unclassified companies
        run: |
          npx tsx scripts/annotate-nse-industries.ts --max ${{ github.event_name == 'workflow_dispatch' && inputs.max_symbols || '12' }}

      - name: Check schema + existing market math
        run: |
          npm run lint
          npx tsx --test src/utils/industryEvidence.test.ts

      - name: Commit source evidence only if records were retrieved
        run: |
          if git diff --quiet -- src/data/nseIndustryQuoteEvidence.json; then
            echo "No valid new NSE company classifications received; no changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/nseIndustryQuoteEvidence.json
          git commit -m "data: annotate NSE quote-backed basic-industry evidence"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
