name: Hourly & Daily Screener Sector Trends Fetcher

on:
  schedule:
    # 03:37 UTC to 13:37 UTC corresponds to 09:07 AM IST to 07:07 PM (19:07) IST, Monday to Friday (Hourly)
    - cron: '37 3-13 * * 1-5'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  fetch-and-deploy-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code from main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install

      - name: Load Prior Snapshots from data-storage Branch
        run: |
          mkdir -p public/data
          # Try to pull latest existing snapshots from the data-storage branch if it exists
          git fetch origin data-storage:data-storage 2>/dev/null || true
          if git show data-storage:public/data/snapshots.json > /dev/null 2>&1; then
            git show data-storage:public/data/snapshots.json > public/data/snapshots.json
            echo "Loaded prior historical snapshots from data-storage branch."
          else
            echo "No existing data-storage branch found; will initialize fresh from main repository."
          fi

      - name: Scrape Screener Market & Generate Compact Snapshot
        run: npm run fetch:daily

      - name: Deploy Snapshots to data-storage Branch (Leaves main untouched)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

          # Copy generated compact snapshot to temp location
          mkdir -p /tmp/data-export
          cp public/data/snapshots.json /tmp/data-export/snapshots.json

          # Reset workspace to prepare for data-storage branch
          git stash --include-untracked 2>/dev/null || true
          
          # Check if data-storage exists on remote
          if git ls-remote --heads origin data-storage | grep -q data-storage; then
            git fetch origin data-storage
            git checkout -B data-storage origin/data-storage
          else
            git checkout --orphan data-storage
            git rm -rf . --ignore-unmatch 2>/dev/null || true
          fi

          mkdir -p public/data
          cp /tmp/data-export/snapshots.json public/data/snapshots.json
          cp /tmp/data-export/snapshots.json snapshots.json

          git add public/data/snapshots.json snapshots.json
          if git diff --staged --quiet; then
            echo "No new changes to commit to data-storage."
          else
            git commit -m "Auto-fetch: Screener industry trends $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data-storage
            echo "Successfully pushed latest snapshot to data-storage branch!"
          fi
