name: Approve owner-reviewed thematic composition

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: owner-theme-composition-review
  cancel-in-progress: false

jobs:
  approve-theme:
    if: >
      github.actor == 'lkshdby' &&
      github.event.issue.user.login == 'lkshdby' &&
      github.event.issue.author_association == 'OWNER' &&
      startsWith(github.event.issue.title, '[Review Theme] Approve composition: ')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund --no-save --package-lock=false
      - name: Validate owner-approved composition and any new NSE ticker
        id: validate
        run: npx tsx scripts/approve-theme-composition-issue.ts
      - name: Commit dated approval record
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/data/themeCompositionReviews.json
          git diff --cached --quiet && exit 1
          if [ "${{ steps.validate.outputs.added_count }}" != "0" ]; then
            # New additions alter the compiled stock universe: do NOT skip
            # Vercel's ordinary main-branch build/deployment.
            git commit -m "feat: add owner-approved NSE theme constituent(s)"
          else
            git commit -m "data: record owner-reviewed theme composition [skip ci]"
          fi
          git restore -- package-lock.json
          if ! git diff --quiet; then
            echo "::error::Unexpected tracked change"
            exit 1
          fi
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
      - name: Queue market refresh for new NSE ticker(s)
        if: steps.validate.outputs.added_count != '0'
        # Data will be collected again at the next scheduled slot even if
        # the optional immediate dispatch is temporarily unavailable.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run market-snapshot-refresh.yml --ref main
      - name: Comment with instructions
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
          ADDED_TICKERS: ${{ steps.validate.outputs.added_tickers }}
        run: |
          if [ -n "$ADDED_TICKERS" ]; then
            gh issue comment "$ISSUE" --body "Owner-approved composition and new NSE ticker(s): $ADDED_TICKERS recorded on main. Market refresh requested; the next scheduled refresh is a fallback. Reload the deployed app after its automatic GitHub deployment, then Reload Saved Data to get verified price histories. Previous recorded signals remain unchanged. Editorial approval does not verify revenue exposure."
          else
            gh issue comment "$ISSUE" --body "Owner-approved thematic composition recorded with timestamp. Return to Rotation Radar and click Refresh approved reviews. The audit is append-only and previously recorded signals remain unchanged. Editorial approval does not independently verify revenue exposure."
          fi
