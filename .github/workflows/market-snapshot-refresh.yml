name: Refresh Committed Market Snapshot

# Three and only three scheduled collection windows per IST calendar day.
# GitHub cron uses UTC:
#   13:00 UTC every day = 18:30 IST every day
#   20:30 UTC every day = 02:00 IST the following day
#   22:30 UTC every day = 04:00 IST the following day
# GitHub schedules are best-effort: runs can be delayed or occasionally skipped.
# Manual workflow_dispatch runs are DRY RUNS: fetch/validate but never publish.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 13 * * *'
    - cron: '30 20 * * *'
    - cron: '30 22 * * *'

permissions:
  contents: write

concurrency:
  group: market-snapshot-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Fetch and validate listed stock closes (manual runs are dry tests)
        env:
          MARKET_REFRESH_MODE: ${{ github.event_name == 'workflow_dispatch' && 'dry-run' || 'scheduled' }}
        run: npx tsx scripts/refresh-market-snapshot.ts
      - name: Confirm manual test did not publish
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: echo "Dry run only. No market snapshot was published." >> "$GITHUB_STEP_SUMMARY"
      - name: Commit validated snapshot (scheduled runs only)
        if: ${{ github.event_name == 'schedule' }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/data/verifiedLiveMarketData.json
          if git diff --cached --quiet; then
            echo "No snapshot changes to commit."
            exit 0
          fi
          git commit -m "data: record scheduled verified sector snapshot [skip ci]"
          # Rebase onto any newer app commits to avoid clobbering them.
          git pull --rebase origin main
          git push origin HEAD:main
