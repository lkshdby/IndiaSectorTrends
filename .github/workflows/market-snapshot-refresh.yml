name: Refresh Committed Market Snapshot

# Three and only three scheduled collection windows per IST calendar day.
# GitHub cron uses UTC:
#   13:00 UTC every day = 18:30 IST every day
#   20:30 UTC every day = 02:00 IST the following day
#   22:30 UTC every day = 04:00 IST the following day
# GitHub schedules are best-effort: runs can be delayed or occasionally skipped.
on:
  workflow_dispatch: # Manual runs also validate and commit to main
  schedule:
    - cron: '0 13 * * *'
    - cron: '30 20 * * *'
    - cron: '30 22 * * *'

permissions:
  contents: write

concurrency:
  group: market-snapshot-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund --no-save --package-lock=false
      - name: Fetch and validate listed stock closes
        run: npx tsx scripts/refresh-market-snapshot.ts
      - name: Commit validated snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/data/verifiedLiveMarketData.json
          if git diff --cached --quiet; then
            echo "No snapshot changes to commit."
            exit 0
          fi
          git commit -m "data: update verified market snapshot [skip ci]"
          # npm install can modify package-lock.json even without dependency edits.
          # Keep only the validated snapshot in the commit and a clean worktree
          # before rebasing; a dirty worktree caused exit code 128 in run 42799275608.
          git restore -- package-lock.json
          if ! git diff --quiet; then
            echo "::error::Unexpected tracked changes after creating snapshot commit:"
            git status --short
            exit 1
          fi
          # Rebase onto concurrent app commits without replacing their changes.
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
