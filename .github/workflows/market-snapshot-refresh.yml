name: Refresh Committed Market Snapshot

# Three and only three scheduled collection windows per Indian trading day.
# GitHub cron uses UTC:
#   13:00 UTC Monday-Friday = 18:30 IST Monday-Friday
#   20:30 UTC Monday-Friday = 02:00 IST Tuesday-Saturday
#   22:30 UTC Monday-Friday = 04:00 IST Tuesday-Saturday
# GitHub schedules are best-effort: runs can be delayed or occasionally skipped.
on:
  schedule:
    - cron: '0 13 * * 1-5'
    - cron: '30 20 * * 1-5'
    - cron: '30 22 * * 1-5'

permissions:
  contents: write

concurrency:
  group: market-snapshot-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Fetch and validate listed stock closes
        run: npx tsx scripts/refresh-market-snapshot.ts
      - name: Commit validated snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/data/verifiedLiveMarketData.json
          if git diff --cached --quiet; then
            echo "No snapshot changes to commit."
            exit 0
          fi
          git commit -m "data: record scheduled verified sector snapshot [skip ci]"
          # Rebase onto any newer app commits to avoid clobbering them.
          git pull --rebase origin main
          git push origin HEAD:main
